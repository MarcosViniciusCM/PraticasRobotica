slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames e Tópicos (Ajuste conforme o seu URDF/Gazebo)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint # ou base_link, dependendo do seu robô
    scan_topic: /scan
    use_map_saver: true
    mode: mapping # Mude para 'localization' no Exercício 3.1 se quiser testar localização pura

    # Parâmetros de atualização e resolução
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0 # Ajuste para o alcance máximo do seu Lidar no Gazebo
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true