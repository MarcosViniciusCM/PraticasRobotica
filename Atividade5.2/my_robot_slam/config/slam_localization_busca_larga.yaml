# (variante busca larga) Pratica 05.2 - Exercicio 3.1: slam_toolbox em modo LOCALIZACAO (mapa ja construido).
# Igual ao slam_mapping.yaml, so muda mode. O mapa (grafo de poses serializado) e a pose inicial
# entram por argumento do launch (map_file_name, map_start_pose).
# Parametros nao listados ficam com o padrao do pacote. Comentarios: so o que mudou do padrao.
slam_toolbox:
  ros__parameters:
    # ---- solver do grafo de poses (padrao) ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- frames e topicos ----
    odom_frame: odom                 # odom -> base_link: odom_tf_node (verdade ou ruidosa)
    map_frame: map                   # map -> odom: publicado pelo slam_toolbox
    base_frame: base_link            # padrao e base_footprint; este robo so tem base_link
    scan_topic: /scan/out            # plugin do Lidar "scan" -> /scan/out
    mode: localization
    use_map_saver: true
    debug_logging: false
    transform_publish_period: 0.02
    map_update_interval: 1.0         # padrao 5 s: mapa atualiza mais rapido para acompanhar
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 8.0             # igual ao alcance do sensor
    minimum_time_interval: 0.2       # padrao 0.5 s
    transform_timeout: 0.5
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    throttle_scans: 1

    # ---- scan matching ----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15    # padrao 0.5 m: mais scans entram no grafo
    minimum_travel_heading: 0.15     # padrao 0.5 rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    correlation_search_space_dimension: 4.0   # variante: janela de casamento de +-2 m
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ---- fechamento de laco (corrige a deriva quando o robo revisita um lugar) ----
    do_loop_closing: true
    loop_search_maximum_distance: 12.0   # variante: busca de laco em toda a sala
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.25
    loop_match_minimum_response_fine: 0.35
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    min_pass_through: 2
    occupancy_threshold: 0.1
